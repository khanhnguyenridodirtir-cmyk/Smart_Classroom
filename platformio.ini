; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
; Đây là file để setup cho môi trường để có thể build với mỗi esp32 mà bạn dùng hãy thiết kế môi trường phù hợp với nó
;  
;
[env]
framework = arduino
monitor_speed = 115200
lib_deps = bblanchon/ArduinoJson @ ^7.0.4 

; =========================================================
; NODE 1: ĐẦY ĐỦ CẢM BIẾN (Có cờ bật RS485, tải thêm Modbus)
; =========================================================
[env:Node1_Full_Sensors]
platform = espressif32
board = yolo_uno 
build_src_filter = +<Node_Sensor/>    ; Trỏ vào thư mục Node_Sensor
build_flags = 
    -D USE_RS485                      ; Cờ kích hoạt code RS485
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
lib_deps = 
    ${env.lib_deps}
    4-20ma/ModbusMaster @ ^2.0.1      ; Chỉ tải thư viện này cho Node 1

; =========================================================
; NODE 2: CHỈ CÓ PIR VÀ ÁNH SÁNG (Bị cắt RS485)
; =========================================================
[env:Node2_Basic_Sensors]
platform = espressif32
board = esp32doit-devkit-v1
build_src_filter = +<Node_Sensor/>    ; Vẫn dùng chung file main.cpp với Node 1
; KHÔNG CÓ cờ -D HAS_RS485
; KHÔNG tải thư viện ModbusMaster

; =========================================================
; NODE 3: TRUNG CHUYỂN ESP-NOW
; =========================================================
[env:Node3_EspNow_Gateway]
platform = espressif32
board = esp32doit-devkit-v1
build_src_filter = +<Node_EspNow/>    ; Trỏ sang một thư mục code hoàn toàn khác